name: Deploy to GitHub Pages (redirects to mubashirrehman.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GROQ_API_KEY:       ${{ secrets.VITE_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build   # includes scripts/check-dist.mjs, the post-build gate
      - name: Layout check across 13 viewports (phones, scaled laptops, desktops, 200% zoom)
        run: |
          npx playwright install --with-deps chromium
          npx astro preview --port 4321 &
          sleep 3
          node scripts/viewport-check.mjs
      # The canonical site is mubashirrehman.com (Cloudflare Pages). This GitHub Pages copy serves the
      # old address, mubashir-rehman.is-a.dev, so every page becomes a redirect to the same path there.
      - run: node scripts/redirect-stubs.mjs dist/public
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
